name: Update F-Droid Repo
on:
  push:
    paths:
      - 'repo/*.apk'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install fdroidserver
        run: sudo apt-get update && sudo apt-get install -y fdroidserver
      - name: Update repo
        run: |
          cd repo
          if [ ! -f keystore.p12 ]; then
            keytool -genkeypair -keystore keystore.p12 -storetype PKCS12 -alias repo -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=F-Droid Repo" -storepass password123 -keypass password123
            printf "keystore: keystore.p12\nkeystorepass: password123\nkeypass: password123\nrepo_keyalias: repo\n" > config.yml
          fi
          fdroid update
      - name: Commit index
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add repo/
          git commit -m "Update F-Droid index" || echo "no changes"
          git push
