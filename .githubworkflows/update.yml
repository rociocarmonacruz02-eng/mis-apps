name: Update F-Droid Repo
on:
  push:
    paths:
      - 'repo/*.apk'
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install fdroidserver
        run: sudo apt-get update && sudo apt-get install -y fdroidserver
      - name: Update repo
        run: cd repo && fdroid update
      - name: Commit index
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add repo/index-v1.json repo/index-v1.jar repo/index-v1.json.asc 2>/dev/null || true
          git commit -m "Update F-Droid index" || echo "no changes"
          git push
